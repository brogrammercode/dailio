name: mobile
description: "Gym Management Platform — Flutter mobile app"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.7.0

  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.0

  # Code generation helpers
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Dependency injection
  injectable: ^2.5.0
  get_it: ^8.0.3

  # Authentication
  google_sign_in: ^6.2.1

  # Push notifications
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.0
  firebase_core: ^3.6.0

  # Camera and location
  camera: ^0.11.0+2
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  connectivity_plus: ^6.1.0
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  injectable_generator: ^2.7.0
  mocktail: ^1.0.4
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - .env
    - .env.example

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
